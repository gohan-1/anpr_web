# ANPR in Docker. Every bot is ONE container; add or remove bots by scaling:
#   docker compose up -d --build
#   docker compose up -d --scale bot-ocr=3
#   docker compose ps  |  docker compose logs -f bot-ocr  |  docker compose down
#
# Web app: http://127.0.0.1:8080      API / admin / Swagger: http://127.0.0.1:8000
# Prefect (optional, only with: docker compose --profile prefect up -d): http://127.0.0.1:4200

name: anpr

services:

  postgres:
    image: postgres:16
    env_file:
      - envs/.env.docker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build: .
    image: anpr-app:latest
    command: python web/manage.py migrate --noinput
    env_file:
      - envs/.env.docker
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  django-api:
    image: anpr-app:latest
    command: python web/manage.py runserver 0.0.0.0:8000
    env_file:
      - envs/.env.docker
    volumes:
      - ./config:/app/config:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  housekeeper:
    image: anpr-app:latest
    command: python web/manage.py housekeeper
    env_file:
      - envs/.env.docker
    volumes:
      - ./config:/app/config:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 10s
    restart: unless-stopped

  frontend:                               # the React web app, served by nginx; /api goes to django-api
    build: ../Frontend
    image: anpr-frontend:latest
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - django-api
    restart: unless-stopped

  prefect:                                # OPTIONAL: only with --profile prefect. Records every batch as a
    image: prefecthq/prefect:3.9.2-python3.12   # flow run when config/settings.yaml has pipeline.use_prefect: true
    profiles: ["prefect"]
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_UI_API_URL: http://127.0.0.1:4200/api
    volumes:
      - prefectdata:/root/.prefect
    ports:
      - "127.0.0.1:4200:4200"
    restart: unless-stopped

  producer:                               # Kafka mode: watches ./data, sends one message per NEW folder
    image: anpr-app:latest                # to anpr.folders; the reader bots consume them
    command: python scripts/publish_folders.py --watch
    env_file:
      - envs/.env.docker
    environment:
      ANPR_PRODUCER_STATE: /app/state/sent.txt
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data:ro
      - producerstate:/app/state          # what was sent survives restarts
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    stop_grace_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------- bots: one per container
  bot-reader:
    image: anpr-app:latest
    command: python -m bots --stage reader --yes
    env_file:
      - envs/.env.docker
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    stop_grace_period: 60s
    restart: unless-stopped

  bot-preprocess:
    image: anpr-app:latest
    command: python -m bots --stage preprocess --yes
    env_file:
      - envs/.env.docker
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 60s
    restart: unless-stopped

  bot-ocr:
    image: anpr-app:latest
    command: python -m bots --stage ocr --yes
    env_file:
      - envs/.env.docker
      - envs/.env.ocr                     # this file must exist (create it, even empty)
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 60s
    restart: unless-stopped

  bot-llm:
    image: anpr-app:latest
    command: python -m bots --stage llm --yes
    env_file:
      - envs/.env.docker
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 60s
    restart: unless-stopped

  bot-trip:
    image: anpr-app:latest
    command: python -m bots --stage trip --yes
    env_file:
      - envs/.env.docker
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 60s
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafkadata:/var/lib/kafka/data
    ports:
      - "127.0.0.1:9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: anpr
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8081:8080"                 # 8080 is the web app (frontend)
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  prefectdata:
  kafkadata:
  producerstate: