# All tunable values live here. Change them without touching code.
# Read by Django, the bots, the supervisor and the housekeeper. After editing:
#   development  make restart          Docker  make docker-restart
# Values marked (Pipeline page) can also be changed live on the Pipeline page; a value
# saved there wins over this file until you press "reset".

paths:
  output_dir: ./output       # Review page: approved/corrected folders are copied here

api:                         # the plate-reading (OCR) API the OCR bots call
  url: "https://your-plate-api.example.com/recognize"
  api_key: ""                # or set env var ANPR_API_KEY
  timeout_seconds: 15
  retries: 3
  retry_delay_seconds: 5
  mock: true                 # true = fake responses for local testing, no real API calls
  mock_latency_seconds: 0.3  # mock only: pretend each call takes this long, like a real API

decision:                    # Review page: what a valid plate looks like (also used by seed_demo)
  weight_confidence: 0.7
  weight_quality: 0.3
  accept_score: 0.85
  review_floor: 0.60
  high_confidence: 0.90
  conflict_confidence: 0.80
  min_quality: 0.40
  consensus_boost: 0.03
  max_consensus_boost: 0.09
  plate_regex: "^[A-Z0-9]{4,10}$"   # replace with your country's plate format

bots:
  stale_after_seconds: 30        # no heartbeat for this long = the bot is considered dead and restarted
  stop_grace_seconds: 60         # how long a bot gets to finish its batch when stopped
  max_bots_per_stage: 50         # upper limit for the + button
  remove_dead_after_minutes: 10  # Docker: a bot container silent this long is gone; its row is removed

reader:
  # How reader bots find new folders (ANPR_READER_MODE in an env file overrides this):
  #   scan  = look in the folders listed under "sources", every stages.reader.scan_every_seconds
  #   kafka = listen to the Kafka topic kafka.topics.folders (one message per vehicle folder)
  mode: scan
  storage_root: ./data          # kafka mode: a message's "folder" is relative to this
  wait_for_files_seconds: 30    # kafka mode: a message may arrive before its images are fully copied
  # scan mode: where vehicle folders arrive. Lower priority number = processed first.
  # For now every folder in ./data goes down the same line. The low/high accuracy split
  # comes later: then replace this with two sources, e.g.
  #   - {name: low-accuracy,  path: ./data/low_accuracy,  accuracy: low,  priority: 1}
  #   - {name: high-accuracy, path: ./data/high_accuracy, accuracy: high, priority: 2}
  # kafka mode uses the priorities of these sources too (message "accuracy": low/high).
  sources:
    - name: data
      path: ./data
      accuracy: high
      priority: 1
  image_extensions: [".jpg", ".jpeg", ".png", ".bmp"]
  min_folder_age_seconds: 30    # scan mode: skip folders changed this recently (camera still writing)
  read_workers: 8               # scan mode: folders read at the same time inside one reader bot

# ---------------------------------------------------------------- assembly line
pipeline:
  heartbeat_seconds: 3          # how often a bot reports in
  idle_sleep_seconds: 2         # how long a bot waits when its line is empty
  use_prefect: true             # each bot batch is recorded as a Prefect flow run (needs the prefect server running)

stages:                         # (Pipeline page) = can also be changed live there
  reader:
    scan_every_seconds: 30      # (Pipeline page) scan mode: how often each reader bot scans its share
  preprocess:
    batch_size: 20              # (Pipeline page) items a bot takes at once
    parallel: 8                 # (Pipeline page) items of a batch handled at the same time
    max_attempts: 3             # (Pipeline page) then the item is marked failed
    stuck_after_minutes: 10     # (Pipeline page) an item held this long by a silent bot goes back to the line
    pause_if_next_line_over: 50000   # (Pipeline page) backpressure: wait while the OCR line is longer than this
    placeholder_seconds: 0.05   # pretend work per item until the real service exists
    # enabled: true             # (Pipeline page switch) false = images skip preprocessing, straight to OCR
  ocr:
    trip_if_confidence_at_least: 0.85   # (Pipeline page) best plate this sure -> trip; less sure -> LLM; no plate -> manual
    batch_size: 20
    parallel: 8
    max_attempts: 3
    stuck_after_minutes: 10
  llm:
    batch_size: 5
    parallel: 3
    max_attempts: 2
    stuck_after_minutes: 15
    placeholder_seconds: 0.2    # pretend work per folder until the real LLM service exists
  trip:
    batch_size: 20
    parallel: 4
    max_attempts: 3
    stuck_after_minutes: 10
    placeholder_seconds: 0.05   # pretend work per folder until the real trip service exists

# ---------------------------------------------------------------- Kafka (reader.mode: kafka)
# Where Kafka is: env KAFKA_BOOTSTRAP_SERVERS (localhost:9094 on the laptop, kafka:9092 in Docker).
kafka:
  partitions: 6                 # partitions per topic, used when a topic is created.
                                # At most this many reader bots get work; more would sit idle.
  groups:
    reader: anpr-readers        # consumer group of the reader bots: they share the partitions
  topics:
    folders: anpr.folders       # upstream -> reader bots (used now)
    failed: anpr.failed         # messages that can never work, with the reason (used now)
    # Reserved for when the later stages move from PostgreSQL to Kafka (not used yet):
    preprocess: anpr.preprocess # reader -> preprocess bots
    ocr: anpr.ocr               # preprocess (or reader, if preprocessing is off) -> ocr bots
    llm: anpr.llm               # ocr -> llm bots
    trip: anpr.trip             # ocr / llm -> trip bots
