# All tunable values live here. Change them without touching code.

paths:
  output_dir: ./output       # Review page: approved/corrected folders are copied here

api:
  url: "https://your-plate-api.example.com/recognize"
  api_key: ""                # or set env var ANPR_API_KEY
  timeout_seconds: 15
  retries: 3
  retry_delay_seconds: 5
  mock: true                 # true = fake responses for local testing, no real API calls
  mock_latency_seconds: 0.3  # mock only: pretend each call takes this long, like a real API

quality:
  blur_reference: 150.0      # Laplacian variance treated as "fully sharp"
  min_side_px: 300           # images smaller than this lose resolution score
  weights: {blur: 0.6, brightness: 0.2, resolution: 0.2}

decision:
  weight_confidence: 0.7     # final_score = 0.7*api_conf + 0.3*quality
  weight_quality: 0.3
  accept_score: 0.85         # final score needed for auto-accept
  review_floor: 0.60         # below this = low-confidence review
  high_confidence: 0.90      # API conf considered "high"
  conflict_confidence: 0.80  # two different plates above this = conflict
  min_quality: 0.40          # images below this count as low quality / blurry
  consensus_boost: 0.03      # added per extra image agreeing on the same plate
  max_consensus_boost: 0.09
  plate_regex: "^[A-Z0-9]{4,10}$"   # replace with your country's plate format

bots:
  stale_after_seconds: 30        # no heartbeat for this long = the bot is considered dead and restarted
  stop_grace_seconds: 60         # how long a bot gets to finish its batch when stopped
  max_bots_per_stage: 50         # upper limit for the + button

reader:
  # Where vehicle folders arrive. Lower priority number = processed first.
  # For now every folder in ./data goes down the same line. The low/high accuracy split
  # comes later: then replace this with two sources, e.g.
  #   - {name: low-accuracy,  path: ./data/low_accuracy,  accuracy: low,  priority: 1}
  #   - {name: high-accuracy, path: ./data/high_accuracy, accuracy: high, priority: 2}
  sources:
    - name: data
      path: ./data
      accuracy: high
      priority: 1
  image_extensions: [".jpg", ".jpeg", ".png", ".bmp"]
  min_folder_age_seconds: 30    # skip folders changed this recently (camera still writing)
  read_workers: 8               # folders read at the same time inside one reader copy
  # Every running reader copy. The scan-sources flow asks each of them to scan.
  instances:
    - http://127.0.0.1:8101
  scan_timeout_seconds: 900
  scan_every_seconds: 60        # when the scan flow runs on a schedule (--serve)

# ---------------------------------------------------------------- assembly line
pipeline:
  heartbeat_seconds: 3          # how often a bot reports in
  idle_sleep_seconds: 2         # how long a bot waits when its line is empty
  use_prefect: false            # true: each batch is recorded as a Prefect flow run (needs prefect server)

stages:
  reader:
    scan_every_seconds: 30      # how often each reader bot scans its share of the folders
  preprocess:
    batch_size: 20              # items a bot takes at once
    parallel: 8                 # items of a batch handled at the same time
    max_attempts: 3             # then the item is marked failed
    stuck_after_minutes: 10     # an item held this long by a silent bot goes back to the line
    pause_if_next_line_over: 50000   # backpressure: wait while the OCR line is longer than this
    placeholder_seconds: 0.05   # pretend work per item until the real service exists (step 3)
  ocr:
    trip_if_confidence_at_least: 0.85   # best plate this sure -> trip; less sure -> LLM; no plate -> manual review
    batch_size: 20
    parallel: 8
    max_attempts: 3
    stuck_after_minutes: 10
  llm:
    batch_size: 5
    parallel: 3
    max_attempts: 2
    stuck_after_minutes: 15
    placeholder_seconds: 0.2    # until step 5
  trip:
    batch_size: 20
    parallel: 4
    max_attempts: 3
    stuck_after_minutes: 10
    placeholder_seconds: 0.05   # until step 6
