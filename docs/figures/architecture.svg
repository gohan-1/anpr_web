<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1f2933">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#46525c"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b3fb0"/></marker>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="700">Figure 1. The parts of the system and how they talk</text>
  <text x="24" y="56" fill="#5b6670">Solid arrows: requests and data. Dashed: optional. Every bot and the API share ONE PostgreSQL database, which is also the queue.</text>

  <!-- people -->
  <rect x="24" y="90" width="170" height="64" rx="10" fill="#f4f5f6" stroke="#9aa5ae"/>
  <text x="109" y="117" text-anchor="middle" font-weight="700">Operator</text>
  <text x="109" y="137" text-anchor="middle" fill="#5b6670">web browser</text>

  <!-- frontend -->
  <rect x="250" y="80" width="220" height="84" rx="10" fill="#eef4fb" stroke="#3b6ea5"/>
  <text x="360" y="104" text-anchor="middle" font-weight="700">Web app (React)</text>
  <text x="360" y="124" text-anchor="middle" fill="#5b6670">Overview · Pipeline · Folders</text>
  <text x="360" y="144" text-anchor="middle" fill="#5b6670">Bots · dev :5173 · Docker :8080</text>
  <line x1="194" y1="122" x2="248" y2="122" stroke="#46525c" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- API -->
  <rect x="530" y="80" width="220" height="84" rx="10" fill="#eef4fb" stroke="#3b6ea5"/>
  <text x="640" y="104" text-anchor="middle" font-weight="700">Django REST API :8000</text>
  <text x="640" y="124" text-anchor="middle" fill="#5b6670">/api/… · /admin/ · /api/docs/</text>
  <text x="640" y="144" text-anchor="middle" fill="#5b6670">token login, read-only guard</text>
  <line x1="470" y1="122" x2="528" y2="122" stroke="#46525c" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="499" y="112" text-anchor="middle" font-size="11" fill="#5b6670">/api</text>

  <!-- DB -->
  <rect x="790" y="170" width="190" height="250" rx="10" fill="#fdf3dc" stroke="#b07d00"/>
  <text x="885" y="196" text-anchor="middle" font-weight="700">PostgreSQL</text>
  <text x="885" y="214" text-anchor="middle" fill="#5b6670">database "anpr"</text>
  <text x="806" y="244" font-size="12">• IntakeFolder / IntakeImage</text>
  <text x="818" y="260" font-size="11" fill="#5b6670">the assembly line: a row's</text>
  <text x="818" y="274" font-size="11" fill="#5b6670">"stage" column = its line</text>
  <text x="806" y="298" font-size="12">• Folder / Image (results)</text>
  <text x="806" y="320" font-size="12">• Bot / BotEvent</text>
  <text x="806" y="342" font-size="12">• StageSettings / StageMinute</text>
  <text x="806" y="364" font-size="12">• users, tokens</text>
  <text x="806" y="398" font-size="11" fill="#5b6670">bots take work with</text>
  <text x="806" y="412" font-size="11" fill="#5b6670">FOR UPDATE SKIP LOCKED</text>
  <path d="M750,140 L885,140 L885,168" fill="none" stroke="#46525c" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- supervisor / housekeeper -->
  <rect x="250" y="210" width="220" height="96" rx="10" fill="#e6f4ea" stroke="#2e7d4f"/>
  <text x="360" y="234" text-anchor="middle" font-weight="700">Supervisor (development)</text>
  <text x="360" y="252" text-anchor="middle" fill="#5b6670">starts/stops one process per Bot row</text>
  <text x="360" y="268" text-anchor="middle" fill="#5b6670">restarts crashed or silent bots</text>
  <text x="360" y="284" text-anchor="middle" fill="#5b6670">housekeeping every 30 s</text>
  <text x="360" y="300" text-anchor="middle" font-size="11" fill="#5b6670">Docker: housekeeper container instead</text>
  <path d="M470,240 L788,240" fill="none" stroke="#46525c" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="630" y="232" text-anchor="middle" font-size="11" fill="#5b6670">reads Bot rows (wanted on/off)</text>

  <!-- bots -->
  <rect x="24" y="340" width="740" height="160" rx="12" fill="#ffffff" stroke="#2e7d4f" stroke-dasharray="0"/>
  <text x="40" y="364" font-weight="700">Bots: one process (or one container) each, assigned to ONE stage</text>
  <g font-size="12">
    <rect x="40" y="414" width="128" height="58" rx="8" fill="#e6f4ea" stroke="#2e7d4f"/><text x="104" y="438" text-anchor="middle" font-weight="700">reader</text><text x="104" y="456" text-anchor="middle" fill="#5b6670">finds folders</text>
    <rect x="186" y="414" width="128" height="58" rx="8" fill="#e6f4ea" stroke="#2e7d4f"/><text x="250" y="438" text-anchor="middle" font-weight="700">preprocess</text><text x="250" y="456" text-anchor="middle" fill="#5b6670">cleans images</text>
    <rect x="332" y="414" width="128" height="58" rx="8" fill="#e6f4ea" stroke="#2e7d4f"/><text x="396" y="438" text-anchor="middle" font-weight="700">ocr</text><text x="396" y="456" text-anchor="middle" fill="#5b6670">reads plates</text>
    <rect x="478" y="414" width="128" height="58" rx="8" fill="#e6f4ea" stroke="#2e7d4f"/><text x="542" y="438" text-anchor="middle" font-weight="700">llm</text><text x="542" y="456" text-anchor="middle" fill="#5b6670">unsure folders</text>
    <rect x="624" y="414" width="128" height="58" rx="8" fill="#e6f4ea" stroke="#2e7d4f"/><text x="688" y="438" text-anchor="middle" font-weight="700">trip</text><text x="688" y="456" text-anchor="middle" fill="#5b6670">creates trips</text>
  </g>
  <text x="40" y="384" font-size="11" fill="#5b6670">Each bot: take a batch from its line → work on the items in parallel → move each item to the next line → heartbeat every 3 s.</text>
  <text x="40" y="398" font-size="11" fill="#5b6670">Add bots to a stage to make that stage faster (Pipeline page + / −, or docker compose --scale).</text>
  <line x1="360" y1="306" x2="360" y2="338" stroke="#46525c" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="368" y="326" font-size="11" fill="#5b6670">starts</text>
  <path d="M764,400 L788,400" fill="none" stroke="#46525c" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>

  <!-- inputs -->
  <rect x="24" y="520" width="200" height="60" rx="10" fill="#f4f5f6" stroke="#9aa5ae"/>
  <text x="124" y="544" text-anchor="middle" font-weight="700">main/data/ (disk)</text>
  <text x="124" y="563" text-anchor="middle" fill="#5b6670">one sub-folder per vehicle</text>
  <rect x="244" y="520" width="200" height="60" rx="10" fill="#f3e8fd" stroke="#7b3fb0"/>
  <text x="344" y="544" text-anchor="middle" font-weight="700">Kafka :9094</text>
  <text x="344" y="563" text-anchor="middle" fill="#5b6670">anpr.folders, fed by the producer</text>
  <line x1="104" y1="518" x2="104" y2="474" stroke="#46525c" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="96" y="500" text-anchor="end" font-size="11" fill="#5b6670">scan mode</text>
  <path d="M300,518 L300,508 L150,508 L150,474" fill="none" stroke="#7b3fb0" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#d)"/>
  <text x="306" y="514" font-size="11" fill="#7b3fb0">kafka mode</text>

  <rect x="464" y="520" width="200" height="60" rx="10" fill="#f4f5f6" stroke="#9aa5ae"/>
  <text x="564" y="544" text-anchor="middle" font-weight="700">OCR API (outside)</text>
  <text x="564" y="563" text-anchor="middle" fill="#5b6670">api.url · mock: true for tests</text>
  <line x1="420" y1="474" x2="520" y2="518" stroke="#46525c" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="684" y="520" width="200" height="60" rx="10" fill="#f4f5f6" stroke="#9aa5ae" stroke-dasharray="6 4"/>
  <text x="784" y="544" text-anchor="middle" font-weight="700">Prefect :4200 (optional)</text>
  <text x="784" y="563" text-anchor="middle" fill="#5b6670">records each batch as a flow run</text>
  <line x1="700" y1="474" x2="760" y2="518" stroke="#46525c" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
</svg>
