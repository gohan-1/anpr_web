      - ocr
      - llm
      - trip
      type: string
      description: |-
        * `reader` - Reading
        * `preprocess` - Preprocessing
        * `ocr` - OCR
        * `llm` - LLM
        * `trip` - Trip
    StageSettingsResult:
      type: object
