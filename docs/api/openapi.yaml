- name: Auth
  description: 'Log in and out. The token goes in `Authorization: Token <token>`.'
- name: Dashboard
  description: Environment and the numbers on the Overview page.
- name: Folders
  description: Folder results (Folders page), review actions, image files.
- name: Bots
  description: 'Every bot of every stage (Bots page): create, start, stop, edit, remove.'
- name: Pipeline
  description: 'The assembly line (Pipeline page): lines, + / −, settings, failures.'
