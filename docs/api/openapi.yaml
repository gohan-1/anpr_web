          $ref: '#/components/schemas/FolderDetail'
      required:
      - folder
      - message
    RouteEnum:
      enum:
      - pending
      - processed
      - accepted
      - review
      - no_plate
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `processed` - Processed
        * `accepted` - Accepted
        * `review` - Review
        * `no_plate` - No plate
        * `failed` - Failed
    ScaleRequestRequest:
      type: object
      properties:
        count:
