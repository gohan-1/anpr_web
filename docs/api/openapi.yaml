          nullable: true
        heartbeat_age:
          type: integer
          nullable: true
          readOnly: true
        healthy:
          type: boolean
          readOnly: true
        current_task:
          type: string
          readOnly: true
        processed:
          type: integer
          readOnly: true
        failed:
