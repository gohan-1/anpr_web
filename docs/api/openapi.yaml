        is_corrupt:
          type: boolean
        quality:
          type: number
          format: double
          nullable: true
        plate:
          type: string
          maxLength: 20
        confidence:
          type: number
          format: double
          nullable: true
        final_score:
          type: number
          format: double
          nullable: true
        api_error:
          type: string
      required:
      - file_name
      - id
    LevelEnum:
      enum:
      - image
      - folder
      type: string
      description: |-
        * `image` - image
        * `folder` - folder
