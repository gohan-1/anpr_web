      - processed
      - restarts
      - shard
      - started_at
      - state
    BotEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        level:
          type: string
          maxLength: 10
        message:
          type: string
      required:
      - created_at
      - id
      - message
    BotRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        stage:
          $ref: '#/components/schemas/StageEnum'
        api_username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
        rate_limit:
          type: number
          format: double
      required:
      - name
    EnvEnum:
      enum:
      - local
      - staging
      - production
      type: string
      description: |-
        * `local` - local
        * `staging` - staging
        * `production` - production
    Environment:
      type: object
      properties:
        env:
          $ref: '#/components/schemas/EnvEnum'
        read_only:
          type: boolean
        database:
          type: string
      required:
      - database
      - env
      - read_only
    Error:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    FailedInEnum:
      enum:
      - reader
      - preprocess
      - ocr
      - llm
      - trip
      type: string
      description: |-
        * `reader` - reader
        * `preprocess` - preprocess
        * `ocr` - ocr
        * `llm` - llm
        * `trip` - trip
    FailedItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        folder:
          type: string
        failed_in:
          $ref: '#/components/schemas/FailedInEnum'
        error:
          type: string
        attempts:
          type: integer
      required:
      - attempts
      - error
      - failed_in
      - folder
      - id
      - name
    FolderDetail:
      type: object
      description: 'Full version for the review screen: includes every image.'
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        route:
          $ref: '#/components/schemas/RouteEnum'
        route_label:
          type: string
          readOnly: true
        scenario:
          type: string
          maxLength: 5
        plate:
          type: string
          readOnly: true
        final_score:
          type: number
          format: double
          nullable: true
        reviewed_by:
          type: string
          maxLength: 150
        created_at:
          type: string
          format: date-time
          readOnly: true
        job:
          type: integer
          nullable: true
        reason:
          type: string
        final_plate:
          type: string
          maxLength: 20
        reviewed_plate:
          type: string
          maxLength: 20
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        best_image:
          type: integer
          nullable: true
        candidates: {}
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
          readOnly: true
        min_quality:
          type: number
          format: double
          readOnly: true
      required:
      - created_at
      - id
      - images
      - min_quality
      - name
      - plate
      - route_label
    FolderList:
      type: object
      description: 'Small version for the folder table: no images, so the list stays
        fast.'
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        route:
          $ref: '#/components/schemas/RouteEnum'
        route_label:
          type: string
          readOnly: true
        scenario:
          type: string
          maxLength: 5
        plate:
          type: string
          readOnly: true
        final_score:
          type: number
          format: double
          nullable: true
        reviewed_by:
          type: string
          maxLength: 150
        created_at:
          type: string
          format: date-time
          readOnly: true
        job:
          type: integer
          nullable: true
      required:
      - created_at
      - id
      - name
      - plate
      - route_label
    Image:
