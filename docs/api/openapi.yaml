      - stage
    StateEnum:
      enum:
      - stopped
      - starting
      - running
      - stopping
      - crashed
      type: string
      description: |-
        * `stopped` - Stopped
        * `starting` - Starting
        * `running` - Running
        * `stopping` - Stopping
        * `crashed` - Crashed
